    iv_env: [any]
    legs_count: 2
    margin_intensive: false
    requires_multi_expiry: false
    earnings_signal: neutral
    default_width: 5.0
    soft_score:
      theta_env: neutral
      skew: neutral

  short_put_spread:
    bias: [bullish]
    iv_env: [high]
    legs_count: 2
    margin_intensive: false
    requires_multi_expiry: false
    earnings_signal: positive
    default_width: 5.0
    soft_score:
      theta_env: positive
      skew: neutral

  long_straddle:
    bias: [neutral_volatile]
    iv_env: [low]
    legs_count: 2
    margin_intensive: false
    requires_multi_expiry: false
    earnings_signal: positive    # Big post-earnings moves benefit straddle buyers

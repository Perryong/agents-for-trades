# Strategy registry — single source of truth for all 40 options strategies.
# Two top-level sections:
#   strategies: eligibility metadata for each strategy
#   legs:       declarative leg definitions (side, type, quantity, strike_offset, expiry)
#
# Strike resolution: anchor_strike + (strike_offset * width)
# Expiry resolution: near_expiry (for "near") or far_expiry (for "far")
#
# Leg patterns:
#   Verticals:    2 legs, same type, offsets 0 and +1, same expiry
#   Butterflies:  3 legs, same type, offsets -1, 0 (qty 2), +1, same expiry
#   Condors:      4 legs, same type, offsets -2, -1, +1, +2, same expiry
#   Iron:         4 legs, mixed put+call, same expiry
#   Calendar:     2 legs, same type+strike, near + far expiry
#   Diagonal:     2 legs, same type, near + far expiry, different strikes
#   Ratio back:   3 legs, sell 1 near ATM + buy 2 further OTM
#   Ratio front:  3 legs, buy 1 near ATM + sell 2 further OTM

strategies:

  # =========================================================================
  # SINGLES (4)
  # =========================================================================

  long_call:
    bias: [bullish]
    iv_env: [any]
    legs_count: 1
    margin_intensive: false
    requires_multi_expiry: false
    earnings_signal: negative    # IV crush after earnings hurts long options
    default_width: 5.0
    soft_score:
      theta_env: negative
      skew: neutral

  long_put:
    bias: [bearish]
    iv_env: [any]
    legs_count: 1
    margin_intensive: false
    requires_multi_expiry: false
    earnings_signal: negative
    default_width: 5.0
    soft_score:
      theta_env: negative
      skew: neutral

  short_call:
    bias: [bearish, neutral]
    iv_env: [high]
    legs_count: 1
    margin_intensive: true
    requires_multi_expiry: false
    earnings_signal: positive    # IV crush benefits short options sellers
    default_width: 5.0
    soft_score:
      theta_env: positive
      skew: neutral

  short_put:
    bias: [bullish, neutral]
    iv_env: [high]
    legs_count: 1
    margin_intensive: true
    requires_multi_expiry: false
    earnings_signal: positive
    default_width: 5.0
    soft_score:
      theta_env: positive
      skew: neutral

  # =========================================================================
  # SPREADS (16)
  # =========================================================================

  long_call_spread:
    bias: [bullish]
    iv_env: [any]
    legs_count: 2
    margin_intensive: false
    requires_multi_expiry: false
    earnings_signal: neutral
    default_width: 5.0
    soft_score:
      theta_env: neutral
      skew: neutral

  short_call_spread:
    bias: [bearish]
    iv_env: [high]
    legs_count: 2
    margin_intensive: false
    requires_multi_expiry: false
    earnings_signal: positive
    default_width: 5.0
    soft_score:
      theta_env: positive
      skew: neutral

  long_put_spread:

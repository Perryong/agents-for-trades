    soft_score:
      theta_env: positive
      skew: neutral

  covered_call:
    bias: [bullish, neutral]
    iv_env: [high]
    legs_count: 1
    margin_intensive: false
    requires_multi_expiry: false
    earnings_signal: positive
    default_width: 5.0
    soft_score:
      theta_env: positive
      skew: neutral

  protective_put:

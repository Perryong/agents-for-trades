  put_front_spread:
    bias: [bullish, neutral]
    iv_env: [high]
    legs_count: 3
    margin_intensive: true
    requires_multi_expiry: false
    earnings_signal: positive
    default_width: 5.0
    soft_score:
      theta_env: positive
      skew: neutral

  # =========================================================================
  # BUTTERFLIES (4)
  # =========================================================================

  long_call_butterfly:
    bias: [neutral]
    iv_env: [low]
    legs_count: 3
    margin_intensive: false
    requires_multi_expiry: false
    earnings_signal: positive    # Max profit if stock pins near center strike
    default_width: 5.0
    soft_score:
      theta_env: positive
      skew: neutral

  short_call_butterfly:
    bias: [neutral_volatile]
    iv_env: [any]
    legs_count: 3
    margin_intensive: false
    requires_multi_expiry: false
    earnings_signal: negative
    default_width: 5.0
    soft_score:
      theta_env: negative

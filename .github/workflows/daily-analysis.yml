name: Daily Trading Analysis

on:
  push:
    paths:
      - ".github/daily-analysis-trigger.txt"
  schedule:
    # 21:30 Asia/Singapore = 13:30 UTC
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker symbol to analyze"
        required: false
        default: "NVDA"

permissions:
  contents: write

concurrency:
  group: daily-trading-analysis
  cancel-in-progress: false

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TICKER: ${{ github.event.inputs.ticker || vars.TRADING_TICKER || 'NVDA' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      QUICK_MODEL: ${{ vars.QUICK_MODEL || 'gpt-5-mini' }}
      DEEP_MODEL: ${{ vars.DEEP_MODEL || 'gpt-5.2' }}
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://api.openai.com/v1' }}
      MAX_DEBATE_ROUNDS: ${{ vars.MAX_DEBATE_ROUNDS || '1' }}
      MAX_RISK_ROUNDS: ${{ vars.MAX_RISK_ROUNDS || '1' }}
      SELECTED_ANALYSTS: ${{ vars.SELECTED_ANALYSTS || 'market,technical,social,news,fundamentals' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv

      - name: Run daily analysis
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from dotenv import load_dotenv

          from tradingagents.default_config import DEFAULT_CONFIG
          from tradingagents.graph.trading_graph import TradingAgentsGraph


          load_dotenv(dotenv_path=".env")

          singapore_date = datetime.now(ZoneInfo("Asia/Singapore")).strftime("%Y-%m-%d")
          ticker = os.getenv("TICKER", "NVDA").strip().upper()

          selected_analysts = [
              a.strip().lower()
              for a in os.getenv(
                  "SELECTED_ANALYSTS",
                  "market,technical,social,news,fundamentals",
              ).split(",")
              if a.strip()
          ]

          config = DEFAULT_CONFIG.copy()
          config["llm_provider"] = os.getenv("LLM_PROVIDER", config["llm_provider"]).lower()
          config["quick_think_llm"] = os.getenv("QUICK_MODEL", config["quick_think_llm"])
          config["deep_think_llm"] = os.getenv("DEEP_MODEL", config["deep_think_llm"])
          config["backend_url"] = os.getenv("BACKEND_URL", config["backend_url"])
          config["max_debate_rounds"] = int(os.getenv("MAX_DEBATE_ROUNDS", str(config["max_debate_rounds"])))
          config["max_risk_discuss_rounds"] = int(os.getenv("MAX_RISK_ROUNDS", str(config["max_risk_discuss_rounds"])))

          graph = TradingAgentsGraph(
              selected_analysts=selected_analysts,
              debug=False,
              config=config,
          )

          _, decision = graph.propagate(ticker, singapore_date)

          summary = {
              "timestamp_singapore": datetime.now(ZoneInfo("Asia/Singapore")).isoformat(),
              "trade_date": singapore_date,
              "ticker": ticker,
              "llm_provider": config["llm_provider"],
              "quick_model": config["quick_think_llm"],
              "deep_model": config["deep_think_llm"],
              "selected_analysts": selected_analysts,
              "decision": decision,
          }

          history_dir = Path("analysis_history") / ticker / singapore_date
          history_dir.mkdir(parents=True, exist_ok=True)

          full_state_logs = sorted(
              (Path("eval_results") / ticker).glob("**/full_states_log_*.json"),
              key=lambda p: p.stat().st_mtime,
          )
          if not full_state_logs:
              full_state_logs = sorted(
                  Path("eval_results").glob("**/full_states_log_*.json"),
                  key=lambda p: p.stat().st_mtime,
              )

          latest_full_states_log = full_state_logs[-1] if full_state_logs else None
          if latest_full_states_log:
              full_states_log_copy = history_dir / "full_states_log.json"
              shutil.copy2(latest_full_states_log, full_states_log_copy)
              summary["full_states_log_source"] = str(latest_full_states_log)
              summary["full_states_log_file"] = str(full_states_log_copy)
          else:
              summary["full_states_log_source"] = None
              summary["full_states_log_file"] = None

          with open(history_dir / "summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, indent=2)

          with open(history_dir / "summary.md", "w", encoding="utf-8") as f:
              f.write("# Daily Trading Analysis Summary\n\n")
              f.write(f"- Timestamp (SGT): {summary['timestamp_singapore']}\n")
              f.write(f"- Trade date: {summary['trade_date']}\n")
              f.write(f"- Ticker: {summary['ticker']}\n")
              f.write(f"- LLM provider: {summary['llm_provider']}\n")
              f.write(f"- Quick model: {summary['quick_model']}\n")
              f.write(f"- Deep model: {summary['deep_model']}\n")
              f.write(f"- Analysts: {', '.join(summary['selected_analysts'])}\n\n")
              f.write(f"- Full states source: {summary['full_states_log_source']}\n")
              f.write(f"- Full states saved: {summary['full_states_log_file']}\n\n")
              f.write("## Decision\n\n")
              f.write(str(summary["decision"]))
              f.write("\n")

          print("Analysis completed.")
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit and push daily summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find eval_results -type f -name "full_states_log_*.json" -print0 | xargs -0 -r git add
          git add analysis_history
          if git diff --cached --quiet; then
            echo "No summary changes to commit."
            exit 0
          fi
          git commit -m "chore: add daily analysis summary (${TICKER})"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-analysis-${{ github.run_number }}
          path: |
            analysis_history/**
            eval_results/**
          if-no-files-found: warn
